packages:
  - 'demo'
  - 'packages/*'
publicHoistPattern:
  - 'mdast-util-to-markdown'
  - '*eslint*'
  - '*prettier*'
  # react/react-dom must reach root node_modules so transitive deps (e.g.
  # tunnel-rat via @excalidraw/excalidraw) resolve them when rich-compose
  # bundles the standalone litexml-html-preview-client.
  - 'react'
  - 'react-dom'
allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@innei/react-tweet@3.4.3'
